<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
  :root{--bg:#fbfbf9;--card:#fff;--ink:#1c1d1f;--ink-soft:#6b6e73;--ink-faint:#9b9ea3;
    --line:#ececea;--line-strong:#dcdcd8;--accent:#2f6b4f;--accent-soft:#eef4f0;--warn:#9a6b3f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:30px 28px;width:100%;max-width:360px}
  h1{font-size:17px;font-weight:600;margin:0 0 6px}
  .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.6}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 6px}
  input{width:100%;padding:10px 12px;font-size:15px;color:var(--ink);background:#fff;
    border:1px solid var(--line-strong);border-radius:9px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px;margin-bottom:14px}
  .row input{flex:1;min-width:0}
  button{font-family:inherit;cursor:pointer;border-radius:9px;font-size:14px;transition:.15s}
  .send{padding:0 14px;background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);white-space:nowrap}
  .send:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .send:disabled{opacity:.5;cursor:default}
  .go{width:100%;padding:11px;font-weight:600;color:#fff;background:var(--accent);border:none;letter-spacing:.3px}
  .go:hover:not(:disabled){opacity:.9}
  .go:disabled{opacity:.5;cursor:default}
  .msg{font-size:12.5px;margin-top:12px;line-height:1.6;min-height:18px}
  .msg.err{color:var(--warn)}
  .msg.ok{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>登录</h1>
  <p class="sub">仅限受邀邮箱。输入邮箱获取验证码,没收到请看垃圾箱。</p>
  <div style="margin-bottom:14px">
    <label>邮箱</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div>
    <label>验证码</label>
    <div class="row">
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code">
      <button class="send" id="sendBtn" onclick="sendCode()">获取验证码</button>
    </div>
  </div>
  <button class="go" id="loginBtn" onclick="doLogin()">登 录</button>
  <p class="msg" id="msg"></p>
</div>
<script>
"use strict";
/* 已登录则直接进站 */
fetch('/auth/me').then(r=>{ if(r.ok) location.replace('/'); }).catch(()=>{});

function setMsg(t,cls){ const m=document.getElementById('msg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }
let timer=null;
function cooldown(sec){
  const b=document.getElementById('sendBtn');
  b.disabled=true; let n=sec;
  b.textContent=n+'s';
  timer=setInterval(()=>{ n--; if(n<=0){ clearInterval(timer); b.disabled=false; b.textContent='获取验证码'; }
    else b.textContent=n+'s'; },1000);
}
async function sendCode(){
  const email=document.getElementById('email').value.trim();
  if(!email){ setMsg('先填邮箱','err'); return; }
  setMsg('发送中…');
  try{
    const r=await fetch('/auth/request-code',{method:'POST',
      headers:{'content-type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    setMsg(d.message||(r.ok?'已发送':'发送失败'), r.ok?'ok':'err');
    if(r.ok) cooldown(60);
    document.getElementById('code').focus();
  }catch(e){ setMsg('网络错误,请重试','err'); }
}
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const code=document.getElementById('code').value.trim();
  if(!email||!code){ setMsg('邮箱和验证码都要填','err'); return; }
  const b=document.getElementById('loginBtn'); b.disabled=true;
  setMsg('验证中…');
  try{
    const r=await fetch('/auth/verify',{method:'POST',
      headers:{'content-type':'application/json'},body:JSON.stringify({email,code})});
    const d=await r.json();
    if(r.ok&&d.ok){ setMsg('登录成功,正在进入…','ok'); location.replace('/'); return; }
    setMsg(d.message||'登录失败','err');
  }catch(e){ setMsg('网络错误,请重试','err'); }
  b.disabled=false;
}
document.getElementById('code').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown',e=>{ if(e.key==='Enter') sendCode(); });
</script>
</body>
</html>
