<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理</title>
<style>
  :root{--bg:#fbfbf9;--card:#fff;--ink:#1c1d1f;--ink-soft:#6b6e73;--ink-faint:#9b9ea3;
    --line:#ececea;--line-strong:#dcdcd8;--accent:#2f6b4f;--accent-soft:#eef4f0;--warn:#9a6b3f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:40px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Segoe UI,Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px}
  h2{font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--ink-soft);text-transform:uppercase;margin:0 0 14px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
  .top a{color:var(--accent);text-decoration:none;font-size:13px}
  .me{font-size:12.5px;color:var(--ink-faint)}
  .stat{display:flex;gap:24px}
  .stat div b{display:block;font-size:22px;font-weight:600;color:var(--accent)}
  .stat div span{font-size:12px;color:var(--ink-faint)}
  .row{display:flex;gap:8px;margin-bottom:14px}
  input{flex:1;min-width:0;padding:10px 12px;font-size:14px;border:1px solid var(--line-strong);
    border-radius:9px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{font-family:inherit;cursor:pointer;border-radius:9px;font-size:13.5px;transition:.15s;
    padding:9px 16px;background:var(--accent);color:#fff;border:none;font-weight:600}
  button:hover{opacity:.9}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  li:last-child{border-bottom:none}
  li .tag{font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px}
  li .rm{background:none;border:none;color:var(--ink-faint);font-size:15px;padding:4px 8px}
  li .rm:hover{color:var(--warn)}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .msg.err{color:var(--warn)} .msg.ok{color:var(--accent)}
  .logout{background:none;border:1px solid var(--line-strong);color:var(--ink-soft);font-weight:400;padding:6px 12px;font-size:12.5px}
  .logout:hover{border-color:var(--warn);color:var(--warn);opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>管理后台</h1><span class="me" id="me"></span></div>
    <span style="display:flex;gap:10px;align-items:center">
      <a href="/">← 回看板</a>
      <button class="logout" onclick="logout()">退出登录</button>
    </span>
  </div>

  <div class="card">
    <h2>API 状态</h2>
    <div class="stat">
      <div><b id="quota">–</b><span>本月剩余额度</span></div>
      <div><b id="nUsers">–</b><span>受邀邮箱</span></div>
    </div>
  </div>

  <div class="card">
    <h2>定时自动拉取</h2>
    <label style="display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;margin-bottom:10px">
      <input type="checkbox" id="schOn" style="width:16px;height:16px;accent-color:var(--accent)">开启自动拉取
    </label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <label style="display:flex;gap:5px;align-items:center;font-size:13.5px;cursor:pointer">
        <input type="radio" name="schMode" value="interval" id="modeInt" style="accent-color:var(--accent)">按间隔:每
      </label>
      <select id="schHours" style="padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;font-family:inherit;font-size:13.5px">
        <option value="1">1</option><option value="2">2</option><option value="4">4</option>
        <option value="6">6</option><option value="12">12</option><option value="24">24</option>
      </select> <span style="font-size:13.5px">小时</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <label style="display:flex;gap:5px;align-items:center;font-size:13.5px;cursor:pointer">
        <input type="radio" name="schMode" value="times" id="modeTimes" style="accent-color:var(--accent)">每天定点(北京时间):
      </label>
      <input id="schTimes" type="text" placeholder="如 10:00, 18:00" style="flex:none;width:170px;padding:7px 10px;font-size:13.5px">
      <button onclick="saveSch()">保存</button>
    </div>
    <p class="msg" id="schMsg"></p>
    <p id="schInfo" style="font-size:11.5px;color:var(--ink-faint);margin:6px 0 0;line-height:1.7"></p>
  </div>

  <div class="card">
    <h2>The Odds API · Key 池</h2>
    <div class="row">
      <input id="newKey" type="text" placeholder="粘贴新的 API key(the-odds-api.com 注册获取)">
      <button onclick="addKey()">添加</button>
    </div>
    <ul id="keys"></ul>
    <p class="msg" id="kmsg"></p>
    <p style="font-size:11.5px;color:var(--ink-faint);margin:8px 0 0">可以放多个 key,某个额度用尽时服务器自动切到下一个。</p>
  </div>

  <div class="card">
    <h2>邀请邮箱(受邀者才能验证码登录)</h2>
    <div class="row">
      <input id="inv" type="email" placeholder="要邀请的邮箱">
      <button onclick="invite()">邀请</button>
    </div>
    <ul id="list"></ul>
    <p class="msg" id="msg"></p>
  </div>
</div>
<script>
"use strict";
function setMsg(t,cls){ const m=document.getElementById('msg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function guard(){
  try{
    const r=await fetch('/auth/me');
    if(!r.ok){ location.replace('/login.html'); return false; }
    const d=await r.json();
    if(!d.admin){ document.body.innerHTML='<p style="text-align:center;margin-top:80px">这个页面需要管理员权限。<a href="/">回看板</a></p>'; return false; }
    document.getElementById('me').textContent=d.email;
    return true;
  }catch(e){ location.replace('/login.html'); return false; }
}
async function refresh(){
  const r=await fetch('/auth/admin/list');
  if(!r.ok) return;
  const d=await r.json();
  const ul=document.getElementById('list'); ul.innerHTML='';
  d.admins.forEach(e=>{ ul.insertAdjacentHTML('beforeend',
    '<li><span>'+esc(e)+' <span class="tag">管理员</span></span></li>'); });
  d.users.forEach(e=>{ const li=document.createElement('li');
    li.innerHTML='<span>'+esc(e)+'</span>';
    const b=document.createElement('button'); b.className='rm'; b.textContent='移除';
    b.onclick=()=>remove(e); li.appendChild(b); ul.appendChild(li); });
  document.getElementById('nUsers').textContent=d.admins.length+d.users.length;
}
async function quota(){
  try{ // 走缓存的代理,通常不耗额度
    const r=await fetch('/api/v4/sports/');
    const rem=r.headers.get('x-requests-remaining');
    document.getElementById('quota').textContent=rem!=null?rem:'?';
  }catch(e){ document.getElementById('quota').textContent='?'; }
}
async function invite(){
  const email=document.getElementById('inv').value.trim();
  if(!email){ setMsg('先填邮箱','err'); return; }
  const r=await fetch('/auth/admin/invite',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({email})});
  const d=await r.json(); setMsg(d.message||'', r.ok?'ok':'err');
  if(r.ok){ document.getElementById('inv').value=''; refresh(); }
}
async function remove(email){
  if(!confirm('移除 '+email+' ?其登录会话也会失效。')) return;
  const r=await fetch('/auth/admin/remove',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({email})});
  const d=await r.json(); setMsg(d.message||'', r.ok?'ok':'err');
  refresh();
}
async function logout(){
  await fetch('/auth/logout',{method:'POST'}).catch(()=>{});
  location.replace('/login.html');
}
/* ---- key 池 ---- */
function setKmsg(t,cls){ const m=document.getElementById('kmsg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }
async function refreshKeys(){
  const r=await fetch('/auth/admin/keys');
  if(!r.ok) return;
  const d=await r.json();
  const ul=document.getElementById('keys'); ul.innerHTML='';
  if(!d.keys.length){ ul.innerHTML='<li><span style="color:var(--ink-faint)">还没有 key,添加一个才能拉取数据</span></li>'; return; }
  d.keys.forEach(k=>{ const li=document.createElement('li');
    li.innerHTML='<span style="font-family:ui-monospace,monospace">'+esc(k.masked)+'</span>';
    const b=document.createElement('button'); b.className='rm'; b.textContent='移除';
    b.onclick=async ()=>{ if(!confirm('移除这个 key?')) return;
      const r2=await fetch('/auth/admin/keys/remove',{method:'POST',
        headers:{'content-type':'application/json'},body:JSON.stringify({i:k.i})});
      const d2=await r2.json(); setKmsg(d2.message||'', r2.ok?'ok':'err'); refreshKeys(); };
    li.appendChild(b); ul.appendChild(li); });
}
async function addKey(){
  const key=document.getElementById('newKey').value.trim();
  if(!key){ setKmsg('先粘贴 key','err'); return; }
  const r=await fetch('/auth/admin/keys/add',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({key})});
  const d=await r.json(); setKmsg(d.message||'', r.ok?'ok':'err');
  if(r.ok){ document.getElementById('newKey').value=''; refreshKeys(); }
}
/* ---- 定时自动拉取 ---- */
function setSchMsg(t,cls){ const m=document.getElementById('schMsg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }
function parseTimes(){
  return document.getElementById('schTimes').value
    .split(/[,,、\s]+/).map(s=>s.trim())
    .filter(s=>/^([01]?\d|2[0-3]):[0-5]\d$/.test(s));
}
function schInfoText(d){
  const n=(d.leagues||[]).length;
  const mode=document.getElementById('modeTimes').checked?'times':'interval';
  const h=+document.getElementById('schHours').value||6;
  const nt=parseTimes().length;
  const perDay=mode==='times'?nt:Math.round(24/h*10)/10;
  const est=n?Math.round(n*5*perDay):0;
  let t='自动拉取使用你上次在看板「选择联赛」保存的组合(当前 '+n+' 个联赛)。';
  if(n&&perDay) t+='按每联赛约 5 额度估算,此设置约耗 '+est+' 额度/天。';
  if(d.lastTs) t+='上次更新:'+new Date(d.lastTs).toLocaleString('zh-CN',{hour12:false})+(d.lastBy==='自动定时'?'(自动)':'');
  document.getElementById('schInfo').textContent=t;
}
let SCHD={leagues:[]};
async function loadSch(){
  const r=await fetch('/auth/admin/schedule');
  if(!r.ok) return;
  SCHD=await r.json();
  document.getElementById('schOn').checked=!!SCHD.enabled;
  document.getElementById('schHours').value=String(SCHD.hours||6);
  document.getElementById(SCHD.mode==='times'?'modeTimes':'modeInt').checked=true;
  document.getElementById('schTimes').value=(SCHD.times||[]).join(', ');
  schInfoText(SCHD);
}
async function saveSch(){
  const enabled=document.getElementById('schOn').checked;
  const mode=document.getElementById('modeTimes').checked?'times':'interval';
  const hours=+document.getElementById('schHours').value||6;
  const times=parseTimes();
  if(mode==='times'&&enabled&&!times.length){ setSchMsg('定点模式要填时间,如 10:00, 18:00','err'); return; }
  const r=await fetch('/auth/admin/schedule',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({enabled,mode,hours,times})});
  const d=await r.json(); setSchMsg(d.message||'', r.ok?'ok':'err');
  schInfoText(SCHD);
}
['schHours','schTimes','modeInt','modeTimes'].forEach(id=>{
  document.getElementById(id).addEventListener('change',()=>schInfoText(SCHD));
});
document.getElementById('newKey').addEventListener('keydown',e=>{ if(e.key==='Enter') addKey(); });
document.getElementById('inv').addEventListener('keydown',e=>{ if(e.key==='Enter') invite(); });
guard().then(ok=>{ if(ok){ refresh(); quota(); refreshKeys(); loadSch(); } });
</script>
</body>
</html>
